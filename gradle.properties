#Sat Jan 03 12:45:00 CET 2026
android.nonTransitiveRClass=true
android.useAndroidX=true

kotlin.code.style=official
kotlin.native.ignoreDisabledTargets=true
kotlin.incremental=true
kotlin.caching.enabled=true

org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.configureondemand=true
org.gradle.jvmargs=-Xmx8048M -Dfile.encoding\=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx8048M"

# workaround, for :data:clean jobs appearing out of nothing in empty dir
org.gradle.continue=true