name: Auto Pull Request

on:
    create:
        branches:
            - '*' # triggers for any new branch

permissions:
    contents: read
    pull-requests: write

jobs:
    create-auto-pull-request:
        # skips for branches starting with no auto pr
        if: "!startsWith(github.ref_name, 'no_auto_pr_')"
        runs-on: ubuntu-latest
        steps:
            # Checkout the repo
            -   name: Checkout repository
                uses: actions/checkout@v6
                with:
                    fetch-depth: 50

            -   name: Open pull request
                env:
                    GH_TOKEN: ${{ secrets.PUSH_TO_GITHUB_TOKEN }}
                run: |
                    # Check if PR already exists
                    if gh pr list --head "${{ github.ref_name }}" --base main --json number --jq '.[0].number' | grep -q .; then
                        echo "PR already exists for this branch"
                        exit 0
                    fi

                    gh pr create \
                        --base main \
                        --head "${{ github.ref_name }}" \
                        --title "[${{ github.ref_name }}]" \
                        --body "Auto PR" \
                        --assignee "${{ github.actor }}"
