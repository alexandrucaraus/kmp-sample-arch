name: Auto Pull Request

on:
    create:
        branches:
            - '*' # triggers for any new branch

permissions:
    contents: read
    pull-requests: write

jobs:
    create-auto-pull-request:
        # skips for branches starting with no auto pr
        if: "!startsWith(github.ref_name, 'no_auto_pr_')"
        runs-on: ubuntu-latest
        steps:
            # Checkout the repo
            -   name: Checkout repository
                uses: actions/checkout@v6
                with:
                    fetch-depth: 50

            -   name: Open pull request
                env:
                    GH_TOKEN: ${{ secrets.PUSH_TO_GITHUB_TOKEN }}
                run: |

                    # Make sure git is authenticated
                    gh auth setup-git

                    # Update main branch
                    git fetch origin main

                    COMMIT_MESSAGES=$(git log --pretty=format:"* %s" origin/main..HEAD 2>/dev/null)

                    PR_BODY=$(cat <<EOF
                    ## 🤖 Auto-generated Pull Request
                    ### 📝 Changes:
                    ${COMMIT_MESSAGES}
                    EOF
                    )

                    # Check if PR already exists
                    if gh pr list --head "${{ github.ref_name }}" --base main --json number --jq '.[0].number' | grep -q .; then
                        echo "PR already exists for this branch"
                        exit 0
                    else
                        echo "NO PR exists for this branch, creating one ..."
                    fi

                    gh pr create \
                        --base main \
                        --head "${{ github.ref_name }}" \
                        --title "[${{ github.ref_name }}]" \
                        --body "PR_BODY" \
                        --assignee "${{ github.actor }}"
