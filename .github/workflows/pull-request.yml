name: Pull Request Checks

on:
    pull_request:
    push:
        branches:
            - main
            - ci_coverage

jobs:
    checks:
        runs-on: ubuntu-latest #self-hosted
        timeout-minutes: 25
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup JDK
              uses: actions/setup-java@v4
              with:
                  distribution: 'temurin'
                  java-version: '17'
                  cache: gradle

            - name: Setup Android Sdk
              uses: android-actions/setup-android@v3

            - name: Accept Android Sdk Licenses
              run: yes | sdkmanager --licenses

            - name: Setup emulator system image
              run: |
                sdkmanager "system-images;android-33;google_apis;x86_64"
                echo "$ANDROID_SDK_ROOT/emulator:$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

            - name: Make gradlew executable
              run: chmod +x ./gradlew

            - name: Cache Gradle
              uses: actions/cache@v3
              with:
                # Directories to cache
                path: |
                    ~/.gradle/caches
                    ~/.gradle/wrapper
                # Key must change when Gradle files change
                key: gradle-${{ runner.os }}-${{ hashFiles('**/build.gradle*', '**/gradle-wrapper.properties') }}
                restore-keys: |
                    gradle-${{ runner.os }}-

#            - name: Cache Maven
#              uses: actions/cache@v3
