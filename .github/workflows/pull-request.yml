name: Pull Request Checks

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    checks:
        runs-on: ubuntu-latest
        continue-on-error: false
        permissions:
            pull-requests: write
            contents: read
            checks: write
            actions: read
        strategy:
            matrix:
                api-level: [ 35 ] #[ 24, 36 ]
        timeout-minutes: 45
        steps:
            -   name: Checkout
                uses: actions/checkout@v6

            -   name: Setup JDK
                uses: actions/setup-java@v4
                with:
                    distribution: 'temurin'
                    java-version: '17'
                    cache: 'gradle'

            -   name: Cache Gradle dependencies
                uses: actions/cache@v4
                with:
                    path: |
                        ~/.gradle/caches
                        ~/.gradle/wrapper
                        ~/.gradle/build-cache
                    key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
                    restore-keys: |
                        ${{ runner.os }}-gradle-

            -   name: Run Linters
                run: |
                    ./gradlew ktlintCheck detekt --parallel

            -   name: Cache Android SDK
                uses: actions/cache@v4
                with:
                    path: |
                        ~/.android/sdk
                        ~/.android/avd
                    key: ${{ runner.os }}-android-sdk-${{ matrix.api-level }}
                    restore-keys: |
                        ${{ runner.os }}-android-sdk-

            -   name: Enable KVM
                run: |
                    echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                    sudo udevadm control --reload-rules
                    sudo udevadm trigger --name-match=kvm

            -   name: AVD cache
                uses: actions/cache@v4
                id: avd-cache
                with:
                    path: |
                        ~/.android/avd/*
                        ~/.android/adb*
                    key: avd-${{ matrix.api-level }}-${{ runner.os }}-${{ github.sha }}
                    restore-keys: |
                        avd-${{ matrix.api-level }}-

            -   name: create AVD and generate snapshot for caching
                if: always()
                uses: reactivecircus/android-emulator-runner@v2
                with:
                    api-level: ${{ matrix.api-level }}
                    force-avd-creation: false
                    arch: x86_64
                    emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
                    disable-animations: false
                    script: echo "Generated AVD snapshot for caching."

            -   name: Run tests and generate coverage report
                if: always()
                uses: reactivecircus/android-emulator-runner@v2
                with:
                    api-level: ${{ matrix.api-level }}
                    force-avd-creation: false
                    arch: x86_64
                    disable-animations: true
                    emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
                    script: ./scripts/test-android-coverage-ci.sh

            -   name: Android Coverage (JaCoCo)
                id: androidCoverage
                uses: madrapps/jacoco-report@v1.7.2
                with:
                    paths: |
                        features/**/build/reports/jacoco/**/*.xml
                        app/build/reports/jacoco/**/*.xml
                        androidApp/build/reports/jacoco/**/*.xml
                        data/**/build/reports/jacoco/**/*.xml
                    token: ${{ secrets.PUSH_TO_GITHUB_TOKEN }}
                    min-coverage-overall: 80
                    min-coverage-changed-files: 80
                    title: '## :lobster: Android Coverage (JaCoCo)'
                    update-comment: true
                    comment-type: 'both'
                    pass-emoji: ':green_circle:'
                    fail-emoji: ':red_circle:'
                    continue-on-error: true

            -   name: Common Coverage (Kover)
                id: commonCoverage
                uses: madrapps/jacoco-report@v1.7.2
                with:
                    paths: |
                        build/reports/kover/report.xml
                    token: ${{ secrets.PUSH_TO_GITHUB_TOKEN }}
                    min-coverage-overall: 80
                    min-coverage-changed-files: 80
                    title: '## :crab: Common Coverage (Kover)'
                    update-comment: true
                    comment-type: 'both'
                    pass-emoji: ':green_circle:'
                    fail-emoji: ':red_circle:'
                    continue-on-error: true

            -   name: Get the Coverage info
                run: |
                    echo "Android - Total: ${{ steps.androidCoverage.outputs.coverage-overall }} Changed: ${{ steps.androidCoverage.outputs.coverage-changed-files }}"
                    echo "Common  - Total: ${{ steps.commonCoverage.outputs.coverage-overall }} Changed: ${{ steps.commonCoverage.outputs.coverage-changed-files }}"

            -   name: Upload Coverage Report
                uses: actions/upload-artifact@v4
                with:
                    name: android-coverage-report
                    path: |
                        build/reports/jacoco/
                        build/reports/kover/
                        app/build/reports/jacoco/
                        androidApp/build/reports/jacoco/
                        features/notes/tests/build/reports/jacoco/
                        data/database/build/reports/jacoco/
                    retention-days: 14

            -   name: Upload coverage to Codecov
                uses: codecov/codecov-action@v4
                with:
                    token: ${{ secrets.CODECOV_TOKEN }}
                    files: |
                        **/build/reports/jacoco/**/*.xml
                        build/reports/kover/**/*.xml
