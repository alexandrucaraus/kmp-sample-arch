name: Pull Request Checks

on:
    #pull_request:
    push:
        branches:
            - main
            - ci_coverage

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    checks:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                api-level: [ 35 ] #[ 24, 36 ]
        timeout-minutes: 45
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup JDK
              uses: actions/setup-java@v4
              with:
                  distribution: 'temurin'
                  java-version: '17'
                  cache: gradle

#            - name: Setup Android Sdk
#              uses: android-actions/setup-android@v3
#
#            - name: Accept Android Sdk Licenses
#              run: yes | sdkmanager --licenses
#
#            - name: Setup emulator system image
#              run: |
#                sdkmanager "system-images;android-33;google_apis;x86_64"
#                echo "$ANDROID_SDK_ROOT/emulator:$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
#
#            - name: Make gradlew executable
#              run: chmod +x ./gradlew

            - name: Cache Gradle
              uses: actions/cache@v3
              with:
                # Directories to cache
                path: |
                    ~/.gradle/caches
                    ~/.gradle/wrapper
                # Key must change when Gradle files change
                key: gradle-${{ runner.os }}-${{ hashFiles('**/build.gradle*', '**/gradle-wrapper.properties') }}
                restore-keys: |
                    gradle-${{ runner.os }}-

#            - name: Cache Maven
#              uses: actions/cache@v3
#              with:
#                path: ~/.m2/repository
#                key: maven-${{ runner.os }}-${{ hashFiles('**/build.gradle*') }}
#                restore-keys: |
#                    maven-${{ runner.os }}-

#            - name: Cache Android SDK
#              uses: actions/cache@v3
#              with:
#                path: ~/.android
#                key: android-sdk-${{ runner.os }}-${{ hashFiles('**/build.gradle*') }}

            - name: Enable KVM
              run: |
                echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                sudo udevadm control --reload-rules
                sudo udevadm trigger --name-match=kvm

            - name: Gradle cache
              uses: gradle/actions/setup-gradle@v3

            - name: AVD cache
              uses: actions/cache@v4
              id: avd-cache
              with:
                path: |
                    ~/.android/avd/*
                    ~/.android/adb*
                key: avd-${{ matrix.api-level }}

            - name: create AVD and generate snapshot for caching
              if: steps.avd-cache.outputs.cache-hit != 'true'
              uses: reactivecircus/android-emulator-runner@v2
              with:
                api-level: ${{ matrix.api-level }}
                force-avd-creation: false
                arch: x86_64
                emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
                disable-animations: false
                script: echo "Generated AVD snapshot for caching."

            - name: Run tests and generate coverage report
              #if: steps.avd-cache.outputs.cache-hit != 'false'
              uses: reactivecircus/android-emulator-runner@v2
              with:
                api-level: ${{ matrix.api-level }}
                force-avd-creation: false
                arch: x86_64
#                target: google_apis
#                profile: pixel_6
#                ram-size: 2048M
#                heap-size: 512M
                disable-animations: true
                emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
                script: ./gradlew androidTestCoverage

            - name: Run tests and generate coverage report
                    #if: steps.avd-cache.outputs.cache-hit != 'false'
              uses: reactivecircus/android-emulator-runner@v2
              with:
                api-level: ${{ matrix.api-level }}
                force-avd-creation: false
                arch: x86_64
                disable-animations: true
                emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
                script: ./gradlew androidTestCoverage

            - name: Debug CI file structure
              run: |
                    pwd
                    ls -la build/reports/jacoco/androidTestCoverage
              continue-on-error: true

            - name: Upload Coverage Report
              uses: actions/upload-artifact@v4
              with:
                  name: android-coverage-report
                  path: |
                      build/reports/jacoco/androidTestCoverage/

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v4
              with:
                  token: 196d224b-3be4-475e-94f3-f34b1e81a8eb
                  files: build/reports/jacoco/androidTestCoverage/androidTestCoverage.xml
