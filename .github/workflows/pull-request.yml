name: Pull Request Checks

on:
    pull_request_target:
        branches:
            - main
#        types:
#            - opened
#            - synchronize  # New commits pushed
#            - reopened
    push:
        branches:
            - main
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    checks:
        runs-on: ubuntu-latest
        permissions:
            pull-requests: write
            contents: read
        strategy:
            matrix:
                api-level: [ 35 ] #[ 24, 36 ]
        timeout-minutes: 45
        steps:
            -   name: Checkout
                uses: actions/checkout@v6
                with:
                    ref: ${{ github.event.pull_request.head.sha }}

            -   name: Setup JDK
                uses: actions/setup-java@v4
                with:
                    distribution: 'temurin'
                    java-version: '17'
                    cache: gradle

            -   name: Cache Gradle dependencies
                uses: actions/cache@v4
                with:
                    path: |
                        ~/.gradle/caches
                        ~/.gradle/wrapper
                        ~/.gradle/build-cache
                    key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
                    restore-keys: |
                        ${{ runner.os }}-gradle-

            -   name: Run Linters
                run: |
                    ./gradlew ktlintCheck detekt --parallel

            -   name: Cache Android SDK
                uses: actions/cache@v4
                with:
                    path: |
                        ~/.android/sdk
                        ~/.android/avd
                    key: ${{ runner.os }}-android-sdk-${{ matrix.api-level }}
                    restore-keys: |
                        ${{ runner.os }}-android-sdk-

            -   name: Enable KVM
                run: |
                    echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                    sudo udevadm control --reload-rules
                    sudo udevadm trigger --name-match=kvm

            -   name: AVD cache
                uses: actions/cache@v4
                id: avd-cache
                with:
                    path: |
                        ~/.android/avd/*
                        ~/.android/adb*
                    key: avd-${{ matrix.api-level }}-${{ runner.os }}-v1
                    restore-keys: |
                        avd-${{ matrix.api-level }}-

            -   name: create AVD and generate snapshot for caching
                if: always()
                uses: reactivecircus/android-emulator-runner@v2
                with:
                    api-level: ${{ matrix.api-level }}
                    force-avd-creation: false
                    arch: x86_64
                    emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
                    disable-animations: false
                    script: echo "Generated AVD snapshot for caching."

            -   name: Run tests and generate coverage report
                if: always()
                uses: reactivecircus/android-emulator-runner@v2
                with:
                    api-level: ${{ matrix.api-level }}
                    force-avd-creation: false
                    arch: x86_64
                    disable-animations: true
                    emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
                    script: ./scripts/test-android-coverage-ci.sh

            -   name: Cache build outputs
                uses: actions/cache@v4
                with:
                    path: |
                        app/build
                        build
                    key: ${{ runner.os }}-build-${{ github.sha }}
                    restore-keys: |
                        ${{ runner.os }}-build-

            -   name: Add coverage to PR
                id: androidCoverage
                uses: madrapps/jacoco-report@v1.7.2
                with:
                    paths: |
                        **/build/reports/jacoco/**/**.xml
                    token: ${{ secrets.GITHUB_TOKEN }}
                    min-coverage-overall: 80
                    min-coverage-changed-files: 80
                    title: '# :lobster: `Android Coverage Report`'
                    update-comment: true
                    comment-type: 'both'
                    pass-emoji: ':green_circle:'
                    fail-emoji: ':red_circle:'
                    continue-on-error: true
                    debug-mode: true

            -   name: Get the Coverage info
                run: |
                    echo "Total coverage ${{ steps.androidCoverage.outputs.coverage-overall }}"

            -   name: Upload Coverage Report
                uses: actions/upload-artifact@v4
                with:
                    name: android-coverage-report
                    path: |
                        build/reports/jacoco/totalCoverageReport/

            -   name: Upload coverage to Codecov
                uses: codecov/codecov-action@v4
                with:
                    token: 196d224b-3be4-475e-94f3-f34b1e81a8eb
                    files: build/reports/jacoco/totalCoverageReport/totalCoverageReport.xml
